# XcodeGen project specification for Gem ID Scanner
name: GemIDScanner

options:
  bundleIdPrefix: com.gemidscanner
  deploymentTarget:
    iOS: "26.4"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "26.0"

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 12.19.3

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CURRENT_PROJECT_VERSION: 4
    MARKETING_VERSION: "1.0.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.gemidscanner.app
    DEVELOPMENT_TEAM: Z2RB57KVQ5
    CODE_SIGN_STYLE: Manual
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO

targets:
  GemIDScanner:
    type: application
    platform: iOS
    sources:
      - path: GemIDScanner/Sources
      - path: GemIDScanner/Resources
    resources:
      - path: GemIDScanner/Resources/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_NAME: GemIDScanner
        PRODUCT_BUNDLE_IDENTIFIER: com.gemidscanner.app
        DEVELOPMENT_TEAM: Z2RB57KVQ5
        CODE_SIGN_STYLE: Manual
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Field Bench"
        INFOPLIST_KEY_NSCameraUsageDescription: "Field Bench uses your camera to capture and identify gemstones, crystals, and minerals in real time."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Field Bench needs access to your photo library to import and identify mineral and gemstone photos."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "26.4"
      configs:
        Release:
          CODE_SIGN_IDENTITY: "Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER: "com.gemidscanner.app AppStore"
    dependencies:
      - sdk: StoreKit.framework
      - sdk: AVFoundation.framework
      - sdk: PhotosUI.framework
      - sdk: Vision.framework
      - sdk: CoreML.framework
      - sdk: FoundationModels.framework
      - package: Firebase
        product: FirebaseAILogic
      - package: Firebase
        product: FirebaseAppCheck
      - package: Firebase
        product: FirebaseRemoteConfig
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseCore

schemes:
  GemIDScanner:
    build:
      targets:
        GemIDScanner: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
