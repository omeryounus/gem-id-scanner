name: TestFlight

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_IDENTIFIER: com.gemidscanner.app
  APPLE_TEAM_ID: Z2RB57KVQ5
  APP_NAME: "Gem ID Scanner"
  APP_SKU: gem-id-scanner-001

jobs:
  build_and_deploy:
    name: Build & Upload to TestFlight
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: gem-id-scanner-ios

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.6
        run: |
          set -euo pipefail
          if [ -d "/Applications/Xcode_26.6.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app
          else
            echo "::error::Xcode 26.6 is not installed on this runner"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install Build Tools
        run: |
          brew install xcodegen
          gem install bundler fastlane --no-document

      - name: Generate Xcode Project
        run: |
          xcodegen generate --spec project.yml

      - name: Verify Required Secrets
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_KEY_BASE64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          missing=0
          for v in APPSTORE_API_KEY_ID APPSTORE_API_ISSUER_ID APPSTORE_API_KEY_BASE64 BUILD_CERTIFICATE_BASE64 P12_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing repository secret: $v"
              missing=1
            else
              echo "✓ Secret present: $v"
            fi
          done
          exit $missing

      - name: Install Apple Distribution Certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: temporary_keychain_password
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          ls -la "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$P12_PASSWORD" \
            -A \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/productbuild

          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | xargs)
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "=== Code Signing Identities ==="
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -Eqi 'Apple Distribution|iPhone Distribution|iOS Distribution'; then
            echo "::error::No Apple Distribution identity found in imported p12 certificate."
            exit 1
          fi

      - name: Setup App Store Connect API Key
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APPSTORE_API_KEY_BASE64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys build
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8"
          echo -n "$APPSTORE_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"

          python3 - <<'PY'
          import json, os, pathlib
          key_id = os.environ["APPSTORE_API_KEY_ID"]
          issuer = os.environ["APPSTORE_API_ISSUER_ID"]
          key_path = pathlib.Path.home() / ".appstoreconnect/private_keys" / f"AuthKey_{key_id}.p8"
          pem = key_path.read_text()
          out = pathlib.Path("build/asc_api_key.json")
          out.write_text(json.dumps({
              "key_id": key_id,
              "issuer_id": issuer,
              "key": pem,
              "in_house": False,
          }))
          print(f"Generated Fastlane API key configuration for {key_id}")
          PY

      - name: Ensure ASC App & Provisioning Profile
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_API_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          APP_IDENTIFIER: ${{ env.APP_IDENTIFIER }}
          APPLE_TEAM_ID: ${{ env.APPLE_TEAM_ID }}
          APP_NAME: ${{ env.APP_NAME }}
          APP_SKU: ${{ env.APP_SKU }}
        run: |
          set -euo pipefail
          mkdir -p build ~/Library/MobileDevice/Provisioning\ Profiles

          export APP_STORE_CONNECT_API_KEY_KEY_ID="$APPSTORE_API_KEY_ID"
          export APP_STORE_CONNECT_API_KEY_ISSUER_ID="$APPSTORE_API_ISSUER_ID"
          export APP_STORE_CONNECT_API_KEY_KEY_FILEPATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8"

          bundle config set --local path 'vendor/bundle'
          bundle install
          bundle exec fastlane ensure_app

          # Fetch or create App Store distribution profile
          bundle exec fastlane sigh -a "$APP_IDENTIFIER" -b "$APPLE_TEAM_ID" --filename "GemIDScanner_AppStore.mobileprovision" --output_path "build" -f --platform "ios" --skip_certificate_verification

          PP_PATH="build/GemIDScanner_AppStore.mobileprovision"
          if [ ! -f "$PP_PATH" ]; then
            PP_PATH=$(ls -t ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision | head -1)
          fi
          test -f "$PP_PATH"
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/ || true

          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< "$(security cms -D -i "$PP_PATH")")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" /dev/stdin <<< "$(security cms -D -i "$PP_PATH")")
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "Using profile: $PROFILE_NAME ($UUID)"

          python3 -c "from pathlib import Path; p=Path('ios/ExportOptions.plist'); p.write_text(p.read_text().replace('YOUR_PROVISIONING_PROFILE_NAME', '''$PROFILE_NAME''')); print(p.read_text())"

      - name: Build Signed IPA
        env:
          APPLE_TEAM_ID: ${{ env.APPLE_TEAM_ID }}
          APP_IDENTIFIER: ${{ env.APP_IDENTIFIER }}
        run: |
          set -euo pipefail
          BUILD_NUMBER="${{ github.run_number }}"
          if [ "$BUILD_NUMBER" -le 1 ]; then BUILD_NUMBER=2; fi

          MARKETING_VERSION="$(printf '%s' "${{ github.ref_name }}" | sed -n 's/^v\([0-9][0-9.]*\)$/\1/p')"
          if [ -z "$MARKETING_VERSION" ]; then
            MARKETING_VERSION="$(sed -n 's/^ *MARKETING_VERSION: *"\([0-9][0-9.]*\)".*/\1/p' project.yml | head -1)"
            echo "::warning::Ref '${{ github.ref_name }}' is not a vX.Y.Z tag; using project.yml version '${MARKETING_VERSION}'"
          fi
          if [ -z "$MARKETING_VERSION" ]; then
            MARKETING_VERSION="1.0.0"
          fi

          ARCHIVE_PATH="$RUNNER_TEMP/GemIDScanner.xcarchive"
          EXPORT_PATH="$PWD/build/ipa"
          mkdir -p "$EXPORT_PATH"

          set -o pipefail
          xcodebuild \
            -project GemIDScanner.xcodeproj \
            -scheme GemIDScanner \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_IDENTIFIER" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            clean archive

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist ios/ExportOptions.plist

          ls -la "$EXPORT_PATH"
          echo "IPA_PATH=$(ls "$EXPORT_PATH"/*.ipa | head -1)" >> "$GITHUB_ENV"
          echo "Built IPA for marketing=$MARKETING_VERSION build=$BUILD_NUMBER"

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA="${IPA_PATH:-$(ls build/ipa/*.ipa | head -1)}"
          echo "Uploading $IPA to TestFlight..."
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          echo "✓ Successfully submitted to App Store Connect / TestFlight."

      - name: Upload IPA Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GemIDScanner-ipa
          path: gem-id-scanner-ios/build/ipa/*.ipa
          if-no-files-found: ignore
          retention-days: 14

      - name: Cleanup Secrets & Keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
          rm -rf ~/.appstoreconnect/private_keys build/asc_api_key.json
